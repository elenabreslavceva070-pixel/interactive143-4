<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренажёр 3: Эксперт кассовых операций + Магазин подарков</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Inter', sans-serif;
        }
        
        body {
            background: linear-gradient(145deg, #e0eaf4 0%, #cfdef3 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .trainer-container {
            max-width: 800px;
            width: 100%;
            background: white;
            border-radius: 48px;
            box-shadow: 0 25px 45px -12px rgba(0,0,0,0.25);
            overflow: hidden;
        }
        
        .header-stats {
            background: #f8fafc;
            padding: 20px 28px;
            border-bottom: 2px solid #eef2f6;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
        }
        
        .progress-area {
            background: #eef2ff;
            padding: 8px 18px;
            border-radius: 100px;
            font-weight: 600;
            color: #1e3a8a;
        }
        
        .wallet {
            background: linear-gradient(135deg, #f9d976, #f39f86);
            padding: 12px 20px;
            border-radius: 60px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            flex: 1;
            min-width: 0;
        }
        
        .coins-stack {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            flex: 1;
            justify-content: flex-start;
            align-items: center;
        }
        
        .coin-icon {
            width: 32px;
            height: 32px;
            background: radial-gradient(circle at 35% 35%, #FFD966, #D4AF37);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: all 0.2s ease;
            flex-shrink: 0;
        }
        
        .coins-stack.many-coins .coin-icon {
            width: 26px;
            height: 26px;
            font-size: 13px;
        }
        
        .coins-stack.very-many-coins .coin-icon {
            width: 22px;
            height: 22px;
            font-size: 11px;
        }
        
        .balance-wrapper {
            display: flex;
            align-items: baseline;
            gap: 5px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        
        .balance-value {
            font-size: 28px;
            font-weight: 800;
            color: #2d1b00;
        }
        
        .balance-label {
            font-weight: 600;
            color: #2d1b00;
        }
        
        .question-panel {
            padding: 32px;
        }
        
        .question-text {
            font-size: 1.6rem;
            font-weight: 600;
            color: #0a2540;
            margin-bottom: 28px;
        }
        
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 28px;
        }
        
        .option-item {
            border: 2px solid #95CAFA;
            border-radius: 28px;
            padding: 14px 24px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 500;
        }
        
        .option-item:hover {
            transform: translateX(5px);
        }
        
        .option-item.selected {
            border: 3px solid #2c7da0;
            background: #e6f4ff;
        }
        
        .action-buttons {
            padding: 0 32px 32px;
            display: flex;
            gap: 18px;
        }
        
        .btn {
            flex: 1;
            padding: 14px;
            border-radius: 44px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            background: #f1f5f9;
            color: #1f2a44;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: #0f2b3d;
            color: white;
            box-shadow: 0 5px 0 #05161f;
        }
        
        .btn-primary:active {
            transform: translateY(2px);
        }
        
        .btn-primary:disabled {
            background: #b9c8da;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .explanation-area {
            margin: 5px 32px 25px;
            padding: 14px 20px;
            border-radius: 24px;
        }
        
        .explanation-correct {
            background: #e6f9e6;
            color: #2b6e2b;
            border-left: 6px solid #4caf50;
        }
        
        .explanation-wrong {
            background: #ffeaea;
            color: #c7362b;
            border-left: 6px solid #e34234;
        }
        
        .lock-message {
            background: #fff3e0;
            padding: 30px;
            text-align: center;
            font-weight: 500;
            color: #b85c00;
            border-radius: 36px;
            margin: 30px;
        }
        
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        
        .product-card {
            background: #f8fafc;
            border-radius: 24px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s;
            border: 2px solid #95CAFA;
        }
        
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        
        .product-card.purchased {
            opacity: 0.7;
            background: #e8f5e9;
            border-color: #4caf50;
        }
        
        .product-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        
        .product-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #0a2540;
        }
        
        .product-price {
            font-size: 1.5rem;
            font-weight: bold;
            color: #d4af37;
            margin: 10px 0;
        }
        
        .product-price span {
            font-size: 0.9rem;
            color: #666;
        }
        
        .btn-shop {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background: #0f2b3d;
            color: white;
            border: none;
            border-radius: 44px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        
        .btn-shop:hover {
            background: #1e4a6b;
            transform: translateY(-2px);
        }
        
        .btn-shop:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-download {
            background: #4caf50;
        }
        
        .btn-download:hover {
            background: #45a049;
        }
        
        .purchased-badge {
            display: inline-block;
            background: #4caf50;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-top: 10px;
        }
        
        .message {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        .animate-pop {
            animation: pop 0.3s ease;
        }
        
        .shop-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            justify-content: center;
        }
        
        .btn-secondary {
            background: #ffb347;
            color: #2d1b00;
            box-shadow: none;
        }
        
        .btn-secondary:hover {
            background: #ff9f1a;
            transform: translateY(-2px);
        }
        
        @media (max-width: 550px) {
            .wallet {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }
            
            .coins-stack {
                justify-content: center;
            }
            
            .balance-wrapper {
                justify-content: center;
            }
        }
        
        .reset-all-btn {
            background: #ffb347;
            color: #2d1b00;
            margin: 0 20px 25px 20px;
            width: calc(100% - 40px);
            box-shadow: none;
            font-weight: bold;
        }
        
        .reset-all-btn:hover {
            background: #ff9f1a;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
<div class="trainer-container" id="app"></div>

<script>
    // ИСПРАВЛЕНО: вопросы с правильными индексами и пояснениями
    const QUESTIONS3 = [
        {
            text: "Будете ли вы применять ККТ, если у вас отсутствует интернет-соединение?",
            options: [
                "Нет, остановлю работу на кассе до восстановления интернет-связи ",
                "Да, если интернет отсутствует по причинам, которые не зависят от меня",
                "Нет, такое применение возможно только в отдаленных от сетей связи местностях"
            ],
            correct: 1,
            explanation: "При перебоях с интернет-связью по причинам, которые не зависят от вас, работу на ККТ можете продолжить. Касса будет продолжать формировать чеки с фискальным признаком, а при восстановлении связи направит накопившиеся чеки в ОФД. Однако такая возможность ограничена 30 календарными днями."
        },
        {
            text: "Какое из нарушений будет считаться грубым и повлечет максимальный штраф?",
            options: [
                "Печать чека шрифтом, который не соответствует нормам",
                "Печать чеков без QR-кода",
                "На торговой точке установлен незарегистрированная в ФНС ККТ"
            ],
            correct: 2,
            explanation: "Если вы используете незарегистрированный ККТ, это грубое нарушение. ФНС это расценивает как сокрытие выручки, и вас могут оштрафовать на максимальный штраф."
        },
        {
            text: "Какой из признаков при анализе данных онлайн-ККТ чаще всего указывает на то, что фирма скрывает выручку?",
            options: [
                "Стабильный средний чек в течение года",
                "Наличие чеков с нулевой суммой при возвратах",
                "Резкое снижение количества пробитых чеков при сохранении уровня закупок товара"
            ],
            correct: 2,
            explanation: "Если в вашей фирме резко снизилось число чеков при прежнем объеме закупок, то это вызовет вопросы у ФНС и станет причиной дополнительной проверки."
        },
        {
            text: "Вы пробили чек закрытия аванса и открытия кредита последним рабочим днем месяца, а товар реализовали позже. Это корректно?",
            options: [
                "Да, чек можно пробить в конце месяца независимо от даты, когда передали товар",
                "Нет, чек нужно пробить в момент, когда передаете товар",
                "Да, если оплата поступит в следующем месяце"
            ],
            correct: 1,
            explanation: "Чек формируют в момент расчета. При отсрочке расчет возникает при передаче товара. Пробивать чек заранее нельзя."
        },
        {
            text: "ИП продает физлицу грузовой автомобиль, который три года использовал в предпринимательской деятельности. Покупатель перечислил деньги на расчетный счет. Будете ли вы в этом случае пробивать кассовый чек?",
            options: [
                "Нет, так как эта операция не относится к основной деятельности",
                "Да, так как автомобиль использовали для бизнеса",
                "Да, но только если сумма сделки будет больше 100 тыс. руб."
            ],
            correct: 1,
            explanation: "Вы обязаны пробить кассовый чек, даже если имущество не относится к основному виду деятельности."
        }
    ];
    
    // Товары в магазине - 4 подарка
    const PRODUCTS = [
        {
            id: 1,
            name: "",
            price: 400,
            description: "Памятка, с помощью которой вы быстро решите, пробивать чек или нет",
            icon: "🎁",
            file: "gift1.pdf"
        },
        {
            id: 2,
            name: "",
            price: 800,
            description: "Две инструкции: как найти чеки, которые есть в программе, но отсутствуют в ФНС",
            icon: "🎁",
            file: "gift2.pdf"
        },
        {
            id: 3,
            name: "",
            price: 1200,
            description: "Книга «Что поменялось в налоговом контроле и как защитить бизнес в 2026 году»",
            icon: "🎁",
            file: "gift3.pdf"
        },
        {
            id: 4,
            name: "",
            price: 1600,
            description: "Ваучер на разбор рабочей ситуации от Алексея Батарина",
            icon: "🏆",
            file: "gift4.pdf"
        }
    ];
    
    const STORAGE_BALANCE3 = 'trainer3_balance';
    const STORAGE_PROGRESS3 = 'trainer3_progress';
    const STORAGE_COMPLETED3 = 'trainer3_completed';
    const STORAGE_PURCHASED = 'trainer3_purchased';
    
    let balance = 0;
    let currentIdx = 0;
    let selected = null;
    let checked = false;
    let completed = false;
    let showShop = false;
    let purchased = [];
    
    function isTrainer2Completed() {
        return localStorage.getItem('trainer2_completed') === 'true';
    }
    
    function showMessage(text, isError = false) {
        const messageDiv = document.createElement('div');
        messageDiv.className = 'message';
        messageDiv.style.background = isError ? '#ffeaea' : '#e6f9e6';
        messageDiv.style.color = isError ? '#c7362b' : '#2b6e2b';
        messageDiv.style.borderLeft = isError ? '4px solid #c7362b' : '4px solid #4caf50';
        messageDiv.innerHTML = text;
        document.body.appendChild(messageDiv);
        
        setTimeout(() => {
            messageDiv.remove();
        }, 3000);
    }
    
    // ДОБАВЛЕНО: Функция для скачивания PDF файлов
    function downloadPDF(fileName, productName) {
        const fileUrl = `pdf/${fileName}`;
        const link = document.createElement('a');
        link.href = fileUrl;
        link.download = fileName;
        link.target = '_blank';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showMessage(`📥 "${productName}" скачивается...`);
    }
    
    function downloadGift(product) {
        if (purchased.includes(product.id)) {
            downloadPDF(product.file, product.name);
            return;
        }
        
        if (balance >= product.price) {
            balance -= product.price;
            purchased.push(product.id);
            savePurchased();
            updateBalanceUI();
            downloadPDF(product.file, product.name);
            showMessage(`🎉 Поздравляем! Вы купили "${product.name}" за ${product.price} монет!`);
            renderShop();
        } else {
            showMessage(`😔 Недостаточно монет! Нужно ${product.price} монет. У вас ${balance} монет.`, true);
        }
    }
    
    function savePurchased() {
        localStorage.setItem(STORAGE_PURCHASED, JSON.stringify(purchased));
        localStorage.setItem(STORAGE_BALANCE3, balance);
    }
    
    function loadPurchased() {
        const saved = localStorage.getItem(STORAGE_PURCHASED);
        if (saved) {
            purchased = JSON.parse(saved);
        } else {
            purchased = [];
        }
    }
    
    function resetAllTrainers() {
        if (confirm('Вы уверены, что хотите полностью сбросить прогресс всех тренажёров? Это также сбросит все купленные подарки.')) {
            localStorage.removeItem('trainer1_completed');
            localStorage.removeItem('trainer1_balance');
            localStorage.removeItem('trainer1_progress');
            localStorage.removeItem('trainer2_completed');
            localStorage.removeItem('trainer2_balance');
            localStorage.removeItem('trainer2_progress');
            localStorage.removeItem('trainer3_completed');
            localStorage.removeItem('trainer3_balance');
            localStorage.removeItem('trainer3_progress');
            localStorage.removeItem(STORAGE_PURCHASED);
            localStorage.setItem('trainer1_balance', '400');
            window.location.reload();
        }
    }
    
    function restartGame() {
        if (confirm('Вы хотите начать тренажеры заново? Купленные подарки останутся. Вы сможете накопить больше монет.')) {
            localStorage.removeItem('trainer1_completed');
            localStorage.removeItem('trainer1_balance');
            localStorage.removeItem('trainer1_progress');
            localStorage.removeItem('trainer2_completed');
            localStorage.removeItem('trainer2_balance');
            localStorage.removeItem('trainer2_progress');
            localStorage.removeItem('trainer3_completed');
            localStorage.removeItem('trainer3_balance');
            localStorage.removeItem('trainer3_progress');
            localStorage.setItem('trainer1_balance', '400');
            window.location.reload();
        }
    }
    
    function loadData() {
        let bal3 = localStorage.getItem(STORAGE_BALANCE3);
        let bal2 = localStorage.getItem('trainer2_balance');
        
        if (bal3 !== null) {
            balance = parseInt(bal3);
        } else if (bal2 !== null) {
            balance = parseInt(bal2);
        } else {
            balance = 400;
        }
        
        let prog = localStorage.getItem(STORAGE_PROGRESS3);
        if (prog) {
            let p = JSON.parse(prog);
            currentIdx = p.currentIdx || 0;
            checked = p.checked || false;
            completed = p.completed || false;
        }
        
        if (localStorage.getItem(STORAGE_COMPLETED3) === 'true') {
            completed = true;
        }
        
        if (completed) {
            currentIdx = QUESTIONS3.length;
        } else if (currentIdx >= QUESTIONS3.length) {
            currentIdx = 0;
            checked = false;
        }
        
        loadPurchased();
    }
    
    function saveProgress() {
        localStorage.setItem(STORAGE_PROGRESS3, JSON.stringify({
            currentIdx: currentIdx,
            checked: checked,
            completed: completed
        }));
        localStorage.setItem(STORAGE_BALANCE3, balance);
        localStorage.setItem(STORAGE_COMPLETED3, completed);
    }
    
    function updateBalanceUI() {
        let balSpan = document.querySelector('.balance-value');
        if (balSpan) {
            balSpan.innerText = balance;
            balSpan.classList.add('animate-pop');
            setTimeout(() => balSpan.classList.remove('animate-pop'), 300);
        }
        
        const stack = document.querySelector('.coins-stack');
        if (stack) {
            stack.innerHTML = '';
            
            let coinsCount = Math.floor(balance / 100);
            if (coinsCount < 0) coinsCount = 0;
            
            stack.classList.remove('many-coins', 'very-many-coins');
            if (coinsCount > 20) {
                stack.classList.add('very-many-coins');
            } else if (coinsCount > 12) {
                stack.classList.add('many-coins');
            }
            
            for (let i = 0; i < coinsCount; i++) {
                let c = document.createElement('span');
                c.className = 'coin-icon';
                c.innerText = '💰';
                stack.appendChild(c);
            }
        }
    }
    
    function changeBalance(delta) {
        balance += delta;
        updateBalanceUI();
        saveProgress();
        
        let w = document.querySelector('.wallet');
        if (w) {
            w.style.transform = 'scale(1.02)';
            setTimeout(() => { if(w) w.style.transform = ''; }, 200);
        }
    }
    
    function checkAnswer() {
        if (checked || selected === null) return;
        let isCor = (selected === QUESTIONS3[currentIdx].correct);
        if (isCor) changeBalance(200);
        else changeBalance(-300);
        checked = true;
        saveProgress();
        render();
    }
    
    function next() {
        if (!checked) return;
        if (currentIdx + 1 < QUESTIONS3.length) {
            currentIdx++;
            selected = null;
            checked = false;
            render();
            saveProgress();
        } else {
            completed = true;
            saveProgress();
            render();
        }
    }
    
    function goToShop() {
        showShop = true;
        renderShop();
    }
    
    function renderShop() {
        let productsHtml = '';
        PRODUCTS.forEach(product => {
            const isPurchased = purchased.includes(product.id);
            productsHtml += `
                <div class="product-card ${isPurchased ? 'purchased' : ''}">
                    <div class="product-icon">${product.icon}</div>
                    <div class="product-title">${product.name}</div>
                    <div class="product-price">💰 ${product.price} <span>монет</span></div>
                    <div style="color: #666; font-size: 0.9rem; margin: 10px 0;">${product.description}</div>
                    ${isPurchased ? '<div class="purchased-badge">✅ Уже куплено</div>' : ''}
                    <button class="btn-shop ${isPurchased ? 'btn-download' : ''}" onclick="window.downloadGiftFromGlobal(${product.id})">
                        ${isPurchased ? '📥 Скачать' : '🛒 Купить'}
                    </button>
                </div>
            `;
        });
        
        const totalSpent = PRODUCTS.reduce((sum, p) => {
            return purchased.includes(p.id) ? sum + p.price : sum;
        }, 0);
        
        app.innerHTML = `
            <div class="header-stats">
                <div class="progress-area">🎁 Магазин подарков</div>
                <div class="wallet">
                    <div class="coins-stack"></div>
                    <div class="balance-wrapper">
                        <span class="balance-value">${balance}</span>
                        <span class="balance-label">монет</span>
                    </div>
                </div>
            </div>
            <div class="question-panel">
                <h2 style="text-align: center; margin-bottom: 20px;">Потратьте монеты на подарки!</h2>
                <p style="text-align: center; color: #666; margin-bottom: 30px;">
                    У вас ${balance} монет. Потратили на подарки: ${totalSpent} монет.
                </p>
                <div class="shop-grid">
                    ${productsHtml}
                </div>
                <div class="shop-buttons">
                    <button class="btn btn-secondary" onclick="window.restartGameFromGlobal()">Пройти тренажеры заново</button>
                    <button class="btn btn-secondary" onclick="window.resetAllFromGlobal()">Сбросить прогресс</button>
                </div>
                <p style="text-align: center; color: #999; margin-top: 20px; font-size: 0.85rem;">
                    Если не хватает монет, пройдите тренажеры заново
                </p>
            </div>
        `;
        updateBalanceUI();
    }
    
    function render() {
        let trainer2ok = isTrainer2Completed();
        
        if (!trainer2ok) {
            app.innerHTML = `
                <div class="trainer-container">
                    <div class="lock-message">
                        🔒 Чтобы открыть этот тренажер, выполните задания в предыдущем уроке.
                    </div>
                </div>
            `;
            return;
        }
        
        if (completed && !showShop) {
            let overallBalance = balance;
            let message = overallBalance >= 0 
                ? "🏆 Блестящий результат! Вы отлично усвоили кассовые операции." 
                : "⚠️ Рекомендуем повторить материал по кассовой дисциплине.";
            
            app.innerHTML = `
                <div class="header-stats">
                    <div class="progress-area">Ваш баланс</div>
                    <div class="wallet">
                        <div class="coins-stack"></div>
                        <div class="balance-wrapper">
                            <span class="balance-value">${overallBalance}</span>
                            <span class="balance-label">монет</span>
                        </div>
                    </div>
                </div>
                <div class="question-panel">
                    <div style="background: #eef2ff; border-radius: 32px; padding: 30px; text-align: center;">
                        <h3></h3>
                        <p style="margin: 20px 0; font-size: 1.1rem;">${message}</p>
                        <p style="font-size: 1.3rem; font-weight: bold; margin: 20px 0;">
                            <strong>Финальный баланс: ${overallBalance} монет</strong>
                        </p>
                        <p style="font-size: 1.2rem;">
                            ${overallBalance >= 0 ? 'Теперь вы можете обменять свои монеты на подарки' : 'Нужно подтянуть знания'}
                        </p>
                        ${overallBalance > 0 ? `
                            <button id="goToShopBtn" class="btn btn-primary" style="margin-top: 20px; background: #ffb347; color: #2d1b00; box-shadow: none;">
                                🎁 Перейти в магазин (${overallBalance} монет)
                            </button>
                        ` : `
                            <button id="restartBtn" class="btn btn-primary" style="margin-top: 20px; background: #ffb347; color: #2d1b00; box-shadow: none;">
                                🔄 Пройти тренажеры заново
                            </button>
                        `}
                        <button id="resetGlobalBtn" class="btn reset-all-btn" style="margin-top: 15px;">🗑️ Сбросить прогресс</button>
                    </div>
                </div>
            `;
            updateBalanceUI();
            
            document.getElementById('goToShopBtn')?.addEventListener('click', goToShop);
            document.getElementById('restartBtn')?.addEventListener('click', restartGame);
            document.getElementById('resetGlobalBtn')?.addEventListener('click', resetAllTrainers);
            return;
        }
        
        if (completed && showShop) {
            renderShop();
            return;
        }
        
        let q = QUESTIONS3[currentIdx];
        let optsHtml = '';
        
        q.options.forEach((opt, i) => {
            let st = '';
            if (checked) {
                if (i === q.correct) {
                    st = 'border-color: #a5d6a5; background: #e9f7e1;';
                } else if (i === selected && i !== q.correct) {
                    st = 'border-color: #f5acac; background: #ffe6e6;';
                }
            }
            const selectedClass = (selected === i) ? 'selected' : '';
            optsHtml += `<div class="option-item ${selectedClass}" data-idx="${i}" style="${st}">${opt}</div>`;
        });
        
        let expl = '';
        if (checked) {
            let corr = (selected === q.correct);
            const pointsText = corr ? '✅ Верно +200 🪙' : '❌ Ошибка -300 🪙';
            expl = `
                <div class="explanation-area ${corr ? 'explanation-correct' : 'explanation-wrong'}">
                    <strong>${pointsText}</strong><br>
                    ${q.explanation}
                </div>
            `;
        }
        
        app.innerHTML = `
            <div class="header-stats">
                <div class="progress-area">Вопрос ${currentIdx+1}/${QUESTIONS3.length}</div>
                <div class="wallet">
                    <div class="coins-stack"></div>
                    <div class="balance-wrapper">
                        <span class="balance-value">${balance}</span>
                        <span class="balance-label">монет</span>
                    </div>
                </div>
            </div>
            <div class="question-panel">
                <div class="question-text">${q.text}</div>
                <div class="options-list">${optsHtml}</div>
            </div>
            <div class="action-buttons">
                <button class="btn btn-primary" id="checkBtn" ${checked || selected === null ? 'disabled' : ''}>Проверить</button>
                <button class="btn" id="nextBtn" ${!checked ? 'disabled' : ''}>Далее →</button>
            </div>
            ${expl}
        `;
        
        document.querySelectorAll('.option-item').forEach(el => {
            el.addEventListener('click', () => {
                if (!checked) {
                    selected = parseInt(el.dataset.idx);
                    render();
                }
            });
        });
        
        document.getElementById('checkBtn')?.addEventListener('click', checkAnswer);
        document.getElementById('nextBtn')?.addEventListener('click', next);
        updateBalanceUI();
    }
    
    window.downloadGiftFromGlobal = function(productId) {
        const product = PRODUCTS.find(p => p.id === productId);
        if (product) {
            downloadGift(product);
        }
    };
    
    window.restartGameFromGlobal = restartGame;
    window.resetAllFromGlobal = resetAllTrainers;
    
    const app = document.getElementById('app');
    loadData();
    render();
</script>
</body>
</html>
